name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Build and Spark tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -s maven-settings.xml -B test
      - name: Secret scan (source and history)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3 git /repo --no-banner
      - name: Alert rules and Prometheus configuration
        run: |
          docker run --rm -v "$PWD/ops/prometheus":/r -w /r --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml
          docker run --rm -v "$PWD/ops/prometheus":/etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
  runtime:
    name: Fresh Compose deployment, demo, restart and crash
    needs: test
    runs-on: ubuntu-24.04
    # Each batch can take minutes on a shared runner; the demo, replay, restart and two crash phases run several.
    timeout-minutes: 45
    # The demo's thresholds are synthetic; only the demo deployment may use them.
    # CODE_VERSION is recorded in every Gold manifest.
    env: {ALLOW_SYNTHETIC_SPECS: 'true', CODE_VERSION: '${{ github.sha }}'}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build pipeline cases
      - run: docker compose --profile demo run --rm simulator
      - run: docker compose --profile demo run --rm verify
      # Full recomputation of the same Bronze history in a separate namespace must match the incremental snapshot.
      - run: docker compose --profile demo run --rm verify io.coldchain.Replay /data /tmp/replay
      - run: scripts/restart-check.sh pharma-cold-chain
      - name: Crash after Bronze commit, before a Gold manifest and after a relay, then replay
        run: docker compose down -v && scripts/crash-check.sh
      - if: failure()
        run: |
          docker compose logs --no-color --tail 200
          docker compose -p pharma-cold-chain-crash logs --no-color --tail 200
      - if: always()
        run: |
          docker compose down -v
          docker compose -p pharma-cold-chain-crash --profile demo down -v
  ops:
    name: Operations drill (stall alert, recovery, checkpoint migration)
    needs: test
    runs-on: ubuntu-24.04
    # The demo, a 6-minute stall before the alert fires, the recovery and a full rebuild in a new namespace.
    timeout-minutes: 60
    env: {CODE_VERSION: '${{ github.sha }}'}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ops-drill.sh
      - if: failure()
        run: docker compose -p pharma-cold-chain-ops --profile ops logs --no-color --tail 200
      - if: always()
        run: docker compose -p pharma-cold-chain-ops --profile ops --profile demo down -v
