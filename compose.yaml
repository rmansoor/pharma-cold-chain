services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in coldchain.sensors coldchain.traceability coldchain.inventory coldchain.specifications; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 4 --replication-factor 1 --config retention.ms=604800000
        done
  pipeline:
    build: .
    depends_on:
      topics: {condition: service_completed_successfully}
    ports: ["4041:4040"]
    environment: {KAFKA_BOOTSTRAP: 'kafka:9092', DATA_DIR: /data}
    volumes: ["pipeline-data:/data"]
  simulator:
    build: .
    profiles: [demo]
    depends_on:
      topics: {condition: service_completed_successfully}
    environment: {KAFKA_BOOTSTRAP: 'kafka:9092'}
    command: [io.coldchain.Simulator]
  verify:
    build: .
    profiles: [demo]
    environment: {DATA_DIR: /data}
    volumes: ["pipeline-data:/data"]
    command: [io.coldchain.VerifyDemo]
volumes:
  kafka-data:
  pipeline-data:
